name: easy_rates_app
description: "EasyRates — Emfuleni municipal account intelligence for ratepayers."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Icons (SVG + Lucide)
  flutter_svg: ^2.0.16
  lucide_icons_flutter: ^3.1.14

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  cupertino_icons: ^1.0.8

  # HTTP client for the live backend (Dio-based api_client)
  dio: ^5.7.0

  # Secure storage for the opaque refresh token (access token stays in memory)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
